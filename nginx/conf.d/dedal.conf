server {
    listen 80;
    server_name dedal.ma www.dedal.ma;

    return 301 https://dedal.ma$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dedal.ma www.dedal.ma;

    ssl_certificate /etc/nginx/certs/dedal-origin.pem;
    ssl_certificate_key /etc/nginx/certs/dedal-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        proxy_pass http://dedal-nginx:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
    }
}